<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farhan Ki Jaan Muskan</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body>
<div id="welcome" class="screen welcome"><div class="hearts">❤ ✨ ❤</div><img src="/public/farhan.jpg"><div class="plus">♥</div><img src="/public/muskan.jpg"><h1>Welcome to Farhan Ki Jaan Muskan</h1><p>Two hearts • One private space</p><button onclick="show('auth')">Enter ❤️</button></div>
<div id="auth" class="screen hidden"><div class="card auth"><div class="tabs"><button onclick="tab('login')">Login</button><button onclick="tab('register')">Registration</button></div><div id="login"><h2>Welcome Muskan ❤️</h2><input id="lemail" placeholder="Email"><input id="lpass" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="register" class="hidden"><h2>Create Account</h2><input id="rname" placeholder="Your name"><input id="remail" placeholder="Email"><input id="rpass" type="password" placeholder="Password"><button onclick="register()">Register</button></div><p id="authmsg"></p></div></div>
<div id="app" class="hidden"><header><div><b>Farhan ❤️ Muskan</b><small id="me"></small></div><button onclick="logout()">Logout</button></header><main><section class="dashboard"><div class="profile"><img src="/public/farhan.jpg"><span>+</span><img src="/public/muskan.jpg"></div><h1>Welcome Muskan ❤️</h1><p>Your private love dashboard</p><div class="search"><input id="searchCode" placeholder="Enter Search Code e.g. FM-ABC123"><button onclick="findUser()">Search</button></div><div id="friend"></div><div class="actions"><button onclick="startCall('video')">📹 Video Call</button><button onclick="startCall('audio')">📞 Voice Call</button><button onclick="focusChat()">💬 Chat</button><button onclick="document.getElementById('aiBox').scrollIntoView()">🤖 AI Voice</button></div></section><section class="chat"><h2>Private Chat</h2><div id="messages"></div><div class="compose"><input id="msg" placeholder="Write a message..."><button onclick="sendChat()">Send</button></div></section><section id="aiBox" class="chat"><h2>🤖 AI Assistant <small>Both phones will hear the reply</small></h2><div id="aimsg"></div><div class="compose"><input id="aiq" placeholder="Ask AI something..."><button onclick="askAI()">Ask & 🔊</button></div></section></main></div>
<div id="call" class="call hidden"><div class="calltop"><b id="callTitle">Call</b><button onclick="hangup()">End</button></div><div class="videos"><video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video></div><div class="callbar"><button onclick="toggleMic()">🎙️ Mic</button><button onclick="toggleCam()">📷 Camera</button><button onclick="askAI()">🤖 Ask AI</button></div></div>
<script src="app.js"></script></body></html>
